name: CI

# Se ejecuta en push/PR a main y manualmente. La app es un único módulo (app/),
# así que no se filtran rutas. Los tests instrumentados (connectedAndroidTest)
# requieren un emulador y no se ejecutan acá; se cubren localmente.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # El Android SDK no siempre viene en el runner; setup-android lo instala
      # y acepta las licencias necesarias para compilar con AGP.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (JUnit + Robolectric)
        run: ./gradlew testDebugUnitTest --no-daemon
